<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Little Goose Blocks · Kids Corner</title><link rel="stylesheet" href="arena.css"><link rel="stylesheet" href="blocks.css"></head><body data-kids="true"><header><a href="kids-corner.html">← Kids Corner</a><span>LITTLE GOOSE BLOCKS</span></header><div class="soundbar"><span id="now-playing">♫ Your original Golden Goose soundtrack</span><button id="music-toggle" aria-pressed="true">Music on</button><button id="next-track">Next song ▸</button><button id="sfx-toggle" aria-pressed="true">Effects on</button><label>Volume <input id="volume" aria-label="Music volume" type="range" min="0" max="1" step=".05" value=".35"></label></div><main><div class="top"><span id="stars-count">★ 0 rows</span><button id="pause">Pause</button></div><canvas id="blocks-board" width="360" height="600" aria-label="Falling blocks game: use the movement buttons below" role="img"></canvas><p id="block-message" role="status">Fill the empty spaces at the bottom!</p><div class="buttons"><button data-action="left" aria-label="Move left">←</button><button data-action="rotate" aria-label="Turn piece">↻ Turn</button><button data-action="right" aria-label="Move right">→</button></div><div class="buttons secondary"><button data-action="down">↓ Down</button><button data-action="drop">Place piece ⤓</button></div><label class="setting"><input id="manual" type="checkbox"> Take my time — pieces move down only when I tap</label><button id="restart">Fresh board</button><p class="note">Slow pieces. No game over. Every filled row gets a celebration.</p></main><div id="intro-screen" class="intro-screen"><img src="golden-goose.svg" width="110" height="100" alt="Golden Goose"><h2>Little Goose<br>Blocks</h2><p>Move the pieces. Fill a row.<br>Celebrate with the Golden Goose!</p><button id="enter-arena" class="primary">LET’S PLAY ♫</button><button id="silent-start" class="quiet">Play without m
